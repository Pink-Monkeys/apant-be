services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SCANNER_BASE_URL: http://scanner:8081
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      scanner:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  scanner:
    build:
      context: .
      dockerfile: docker/scanner/Dockerfile
    env_file:
      - .env
    environment:
      NMAP_TIMEOUT_SECONDS: 60
      SCANNER_PORT: 8081
      SCANNER_TOOL_TIMEOUT_SECONDS: 300
      HOME: "/home/scanner"
      MITMPROXY_DIR: "/home/scanner/.mitmproxy"
    ports:
      - "8081:8081"
    volumes:
      - ./data/wordlists:/wordlists:ro
      - nuclei-templates:/home/scanner/.nuclei-templates
    cap_add:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /home/scanner/.cache:uid=10001,gid=10001,mode=0700
      - /home/scanner/.config:uid=10001,gid=10001,mode=0700
      - /home/scanner/.mitmproxy:uid=10001,gid=10001,mode=0700
      - /home/scanner/.sqlmap:uid=10001,gid=10001,mode=0700
      - /home/scanner/.local:uid=10001,gid=10001,mode=0700
      - /home/scanner/nuclei-reports:uid=10001,gid=10001,mode=0700
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ../apant-fe
      dockerfile: Dockerfile
      target: dev
      args:
        VITE_API_BASE_URL: http://localhost:8000

    ports:
      - "5173:5173"

    depends_on:
      api:
        condition: service_started

    restart: unless-stopped
  

volumes:
  nuclei-templates:
  postgres-data:
