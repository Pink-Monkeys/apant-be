# Air config for hot reload during development.
# Docs: https://github.com/air-verse/air

root = "."

tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/apant-be.exe ./cmd/api"
  entrypoint = "./tmp/apant-be.exe"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "data", "docs", "scripts", "vendor", ".git"]
  exclude_file = []
  delay = 100
  log = "build-errors.log"

[log]
  time = true

[color]
  main = "yellow"
  watcher = "cyan"
  build = "green"
  runner = "magenta"

[screen]
  clear_on_rebuild = true
  keep_scroll = true
